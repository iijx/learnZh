<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Central solid black circle -->
  <circle cx="50" cy="50" r="21" fill="#000000" />
  <!-- 8 radial rays with rounded ends -->
  <!-- Top 0° -->
  <line x1="50" y1="12" x2="50" y2="21" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Bottom 180° -->
  <line x1="50" y1="79" x2="50" y2="88" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Left 270° -->
  <line x1="12" y1="50" x2="21" y2="50" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Right 90° -->
  <line x1="79" y1="50" x2="88" y2="50" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Top-Right 45° -->
  <line x1="70.5" y1="29.5" x2="77" y2="23" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Bottom-Right 135° -->
  <line x1="70.5" y1="70.5" x2="77" y2="77" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Bottom-Left 225° -->
  <line x1="29.5" y1="70.5" x2="23" y2="77" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
  <!-- Top-Left 315° -->
  <line x1="29.5" y1="29.5" x2="23" y2="23" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />
</svg>
